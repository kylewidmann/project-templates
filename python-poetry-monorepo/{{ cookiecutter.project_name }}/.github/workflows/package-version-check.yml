name: Package Version Check

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'

jobs:
  package-version-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch main
        run: git fetch origin main

      - name: Check module version bumps
        run: |
          set -e
          SRC_DIR="src"
          FAILED=""
          FAIL_MSG=""

          # Get version: VERSION file first, else pyproject.toml [tool.poetry] version
          get_version() {
            local dir="$1"
            if [ -f "$dir/VERSION" ]; then
              head -1 "$dir/VERSION" | tr -d '\n\r \t'
            elif [ -f "$dir/pyproject.toml" ]; then
              sed -n '/^\[tool\.poetry\]/,/^\[/p' "$dir/pyproject.toml" \
                | grep '^version = ' | head -1 \
                | sed -E 's/^version = ["'"'"']([^"'"'"']+)["'"'"'].*/\1/'
            else
              echo ""
            fi
          }

          # Returns "ok" if second semver > first
          version_gt() {
            local main_ver="$1" pr_ver="$2"
            [ -z "$pr_ver" ] && { echo "fail"; return; }
            [ -z "$main_ver" ] && main_ver="0.0.0"
            HIGHER=$(printf '%s\n%s\n' "$main_ver" "$pr_ver" | sort -V | tail -n1)
            if [ "$HIGHER" = "$pr_ver" ] && [ "$main_ver" != "$pr_ver" ]; then
              echo "ok"
            else
              echo "fail"
            fi
          }

          MODULES=$(find "$SRC_DIR" -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort)

          # Only require version bump when package source (src/<pkg>/<pkg_slug>/) changes
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD -- "$SRC_DIR/" || true)
          CHANGED_MODULES=""
          for MODULE in $MODULES; do
            PACKAGE="${MODULE//-/_}"
            if echo "$CHANGED_FILES" | grep -q "^$SRC_DIR/$MODULE/$PACKAGE/"; then
              CHANGED_MODULES="${CHANGED_MODULES}${MODULE}"$'\n'
            fi
          done
          CHANGED_MODULES=$(echo "$CHANGED_MODULES" | sort -u | grep -v '^$' || true)

          if [ -z "$CHANGED_MODULES" ]; then
            echo "No module source changes detected. Nothing to verify."
            exit 0
          fi

          echo "Modules with changes: $CHANGED_MODULES"
          echo ""

          for MODULE in $CHANGED_MODULES; do
            MODULE_DIR="$SRC_DIR/$MODULE"
            [ ! -d "$MODULE_DIR" ] && continue

            MAIN_VERSION=$(git show origin/main:"$MODULE_DIR/VERSION" 2>/dev/null \
              | head -1 | tr -d '\n\r \t' || true)
            if [ -z "$MAIN_VERSION" ]; then
              MAIN_VERSION=$(git show origin/main:"$MODULE_DIR/pyproject.toml" 2>/dev/null \
                | sed -n '/^\[tool\.poetry\]/,/^\[/p' | grep '^version = ' | head -1 \
                | sed -E 's/^version = ["'"'"']([^"'"'"']+)["'"'"'].*/\1/' || true)
            fi
            [ -z "$MAIN_VERSION" ] && MAIN_VERSION="0.0.0"

            PR_VERSION=$(get_version "$MODULE_DIR")
            GT=$(version_gt "$MAIN_VERSION" "$PR_VERSION")

            if [ "$GT" = "ok" ]; then
              echo "✅ $MODULE: $MAIN_VERSION → $PR_VERSION (bumped)"
            else
              if [ -z "$PR_VERSION" ]; then
                FAIL_MSG="${FAIL_MSG}- $MODULE: No version found. Add a VERSION file (main=$MAIN_VERSION).\n"
              else
                FAIL_MSG="${FAIL_MSG}- $MODULE: Version must be higher than main. main=$MAIN_VERSION, PR=$PR_VERSION.\n"
              fi
              FAILED=1
            fi
          done

          if [ -n "$FAILED" ]; then
            echo ""
            echo "::error::One or more modules with changes are missing a version bump."
            echo -e "$FAIL_MSG"
            exit 1
          fi
